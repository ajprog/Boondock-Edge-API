name: Publish Edge API release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: What kind of release should be published?
        required: true
        type: choice
        options:
          - beta
          - numbered

      source_ref:
        description: Branch, tag, or commit to package
        required: true
        default: main
        type: string

      version:
        description: Numbered tag, required for numbered releases (example v2.0.0-beta.02)
        required: false
        type: string

      display_name:
        description: Human-readable release name (example Edge API v2.0 beta.01d)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-edge-api-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Determine release metadata
        id: release
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          VERSION_INPUT: ${{ inputs.version }}
          DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          set -euo pipefail

          COMMIT="$(git rev-parse HEAD)"

          if [[ "$RELEASE_TYPE" == "beta" ]]; then
            TAG="beta"
            VERSION="$DISPLAY_NAME"
            PRERELEASE="true"
          elif [[ "$RELEASE_TYPE" == "numbered" ]]; then
            TAG="$VERSION_INPUT"

            if [[ -z "$TAG" ]]; then
              echo "A version is required for numbered releases." >&2
              exit 1
            fi

            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
              echo "Invalid numbered tag: $TAG" >&2
              echo "Expected vX.Y.Z or vX.Y.Z-beta.N" >&2
              exit 1
            fi

            VERSION="${TAG#v}"

            if [[ "$TAG" == *"-beta."* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          else
            echo "Unsupported release type: $RELEASE_TYPE" >&2
            exit 1
          fi

          {
            echo "commit=$COMMIT"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure numbered tag does not already exist
        if: inputs.release_type == 'numbered'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "The numbered tag already exists: $TAG" >&2
            echo "Numbered release tags are immutable." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run API tests
        run: |
          set -euo pipefail

          python -m pytest -q

      - name: Generate build metadata
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          built_at = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )

          build_info = {
              "component": "api",
              "release_type": os.environ["RELEASE_TYPE"],
              "version": os.environ["VERSION"],
              "display_name": os.environ["DISPLAY_NAME"],
              "git_tag": os.environ["TAG"],
              "git_commit": os.environ["COMMIT"],
              "built_at": built_at,
              "repository": os.environ["REPOSITORY"],
              "github_run_id": os.environ["RUN_ID"],
              "github_run_attempt": int(os.environ["RUN_ATTEMPT"]),
          }

          Path("app/build-info.json").write_text(
              json.dumps(build_info, indent=2) + "\n",
              encoding="utf-8",
          )

          manifest = {
              "format": "boondock-edge-release",
              "format_version": 1,
              **build_info,
              "build_id": os.environ["COMMIT"],
              "components": {
                  "api": {
                      "path": "api",
                      "files": [
                          "run.py",
                          "config.py",
                          "manage.py",
                          "requirements.txt",
                      ],
                  },
              },
          }

          Path("manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Assemble API package
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          PACKAGE_DIR="$RUNNER_TEMP/edge-api-package"
          ARCHIVE="boondock-edge-api-${TAG}.tar.gz"

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/api"

          cp -a app "$PACKAGE_DIR/api/app"
          cp run.py "$PACKAGE_DIR/api/"
          cp config.py "$PACKAGE_DIR/api/"
          cp manage.py "$PACKAGE_DIR/api/"
          cp requirements.txt "$PACKAGE_DIR/api/"
          cp manifest.json "$PACKAGE_DIR/"

          tar \
            --create \
            --gzip \
            --file "$ARCHIVE" \
            --directory "$PACKAGE_DIR" \
            manifest.json \
            api

          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

          {
            echo "ARCHIVE=$ARCHIVE"
            echo "CHECKSUM=${ARCHIVE}.sha256"
          } >> "$GITHUB_ENV"

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail

          tar --list --gzip --file "$ARCHIVE"
          sha256sum --check "$CHECKSUM"

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      # ---------------------------------------------------------------
      # Rolling beta
      # ---------------------------------------------------------------

      - name: Move beta tag
        if: inputs.release_type == 'beta'
        shell: bash
        env:
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail

          git tag --force beta "$COMMIT"
          git push --force origin refs/tags/beta

      - name: Create or update beta GitHub Release
        if: inputs.release_type == 'beta'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          set -euo pipefail

          if gh release view beta >/dev/null 2>&1; then
            gh release edit beta \
              --title "$DISPLAY_NAME" \
              --prerelease
          else
            gh release create beta \
              --verify-tag \
              --title "$DISPLAY_NAME" \
              --generate-notes \
              --prerelease
          fi

          gh release upload beta \
            "$ARCHIVE" \
            "$CHECKSUM" \
            --clobber

      # ---------------------------------------------------------------
      # Numbered release
      # ---------------------------------------------------------------

      - name: Create numbered tag
        if: inputs.release_type == 'numbered'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          set -euo pipefail

          git tag \
            --annotate "$TAG" \
            --message "$DISPLAY_NAME" \
            "$COMMIT"

          git push origin "refs/tags/$TAG"

      - name: Publish numbered GitHub Release
        if: inputs.release_type == 'numbered'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail

          RELEASE_OPTIONS=()

          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_OPTIONS+=(--prerelease)
          fi

          gh release create "$TAG" \
            --verify-tag \
            --title "$DISPLAY_NAME" \
            --generate-notes \
            "${RELEASE_OPTIONS[@]}" \
            "$ARCHIVE" \
            "$CHECKSUM"

      - name: Build latest release asset
        if: inputs.release_type == 'numbered'
        shell: bash
        run: |
          set -euo pipefail

          LATEST_ARCHIVE="boondock-edge-api-latest.tar.gz"

          cp "$ARCHIVE" "$LATEST_ARCHIVE"
          sha256sum "$LATEST_ARCHIVE" > "${LATEST_ARCHIVE}.sha256"

          {
            echo "LATEST_ARCHIVE=$LATEST_ARCHIVE"
            echo "LATEST_CHECKSUM=${LATEST_ARCHIVE}.sha256"
          } >> "$GITHUB_ENV"

      - name: Move latest tag
        if: inputs.release_type == 'numbered'
        shell: bash
        env:
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail

          git tag --force latest "$COMMIT"
          git push --force origin refs/tags/latest

      - name: Create or update latest GitHub Release
        if: inputs.release_type == 'numbered'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail

          if gh release view latest >/dev/null 2>&1; then
            if [[ "$PRERELEASE" == "true" ]]; then
              gh release edit latest \
                --title "$DISPLAY_NAME" \
                --prerelease
            else
              gh release edit latest \
                --title "$DISPLAY_NAME" \
                --latest
            fi
          else
            RELEASE_OPTIONS=()

            if [[ "$PRERELEASE" == "true" ]]; then
              RELEASE_OPTIONS+=(--prerelease)
            else
              RELEASE_OPTIONS+=(--latest)
            fi

            gh release create latest \
              --verify-tag \
              --title "$DISPLAY_NAME" \
              --generate-notes \
              "${RELEASE_OPTIONS[@]}"
          fi

          gh release upload latest \
            "$LATEST_ARCHIVE" \
            "$LATEST_CHECKSUM" \
            --clobber
